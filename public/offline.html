<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="robots" content="noindex">
  <title>אין חיבור לרשת — השוואת נדל"ן</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <!-- Shown by the service worker (sw.js) when a page is opened with no
       network and no cached copy. Self-contained: no stylesheet or script to
       fetch, absolute links only (it can be served at any path). -->
  <style>
    :root { --bg: #f6f7f9; --panel: #fff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; --accent-ink: #fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --panel: #1a1f25; --text: #e5e7eb; --muted: #9ca3af; --line: #2d333b; --accent: #60a5fa; --accent-ink: #0b1220; color-scheme: dark; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, "Segoe UI", Arial, sans-serif; }
    main { max-width: 30rem; margin: 1rem; padding: 2rem 1.6rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 14px; }
    h1 { font-size: 1.3rem; margin: .8rem 0 .4rem; }
    p { margin: .4rem 0; color: var(--muted); }
    a.btn { display: inline-block; margin-top: 1rem; padding: .5rem 1.4rem; border-radius: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>אין חיבור לרשת</h1>
    <p>הדף הזה לא נשמר במכשיר, ואי אפשר לטעון אותו בלי חיבור.</p>
    <p>נתוני העסקאות נשלפים מ-OVER בזמן אמת ואינם נשמרים במכשיר — כדי לנתח אזור צריך חיבור לרשת.</p>
    <a class="btn" href="/">לנסות שוב</a>
  </main>
</body>
</html>
